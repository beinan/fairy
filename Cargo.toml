[workspace]
members = [
    "common",
    "worker",
    "client",
    "fuse",
    "runtime",
]

resolver = "2"

[workspace.dependencies]
log = "0.4.22"
fern = { version = "0.7.0", features = ["colored"] }
humantime = "2.1.0"
anyhow = "1.0.93"
thiserror = "2.0.3"
tokio = { version = "1.41.1", features = ["full"] }

lazy_static = "1.5.0"
ahash = "0.8.11"

monoio = "0.2.4"
monoio-compat = "0.2.2"

bytes = {version = "1.8.0"}

h2 = {version = "0.4.6"}
http = {version = "1.1.0"}
